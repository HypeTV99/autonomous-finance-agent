<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Yire — Records</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter Tight','system-ui','sans-serif']}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
<style>
*{box-shadow:none!important}
body{font-family:'Inter Tight',system-ui,sans-serif;font-weight:300;color:#061b31;background:#fff;font-feature-settings:"ss01" on,"tnum" on}
h1,h2{font-weight:300;letter-spacing:-0.02em}
.card{background:#fff;border:1px solid #e5edf5;border-radius:4px}
.btn{display:inline-flex;align-items:center;gap:.5rem;font-weight:400;font-size:14px;padding:14.5px 24px;border-radius:9999px;border:1px solid transparent;cursor:pointer;text-decoration:none}
.btn-primary{background:#533afd;color:#fff}.btn-ghost{background:transparent;color:#533afd;border-color:#b9b9f9}.btn-tert{background:transparent;color:#533afd;border-color:#d6d9fc;padding:10px 16px}
.nav-a{font-weight:400;font-size:14px;color:#061b31;text-decoration:none;padding:8px 4px;margin-right:8px}.nav-a.on{color:#533afd;border-bottom:2px solid #533afd}
.divider{border-top:1px solid #e5edf5}
.material-symbols-outlined{color:#533afd}
.seg button,.seg a{position:relative;z-index:1;border:0;background:transparent;font:400 13px 'Inter Tight',sans-serif;padding:8px 16px;color:#64748d;cursor:pointer;border-radius:9999px;white-space:nowrap;text-decoration:none}
.seg button.on,.seg a.on{color:#fff}
.seg-pill{position:absolute;top:4px;left:0;height:calc(100% - 8px);width:0;background:#533afd;border-radius:9999px;pointer-events:none;transition:left .35s cubic-bezier(.34,1.3,.64,1),width .35s cubic-bezier(.34,1.3,.64,1)}
@view-transition{navigation:auto}
main{animation:pageIn .38s cubic-bezier(.22,1,.36,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pageOut{to{opacity:0;transform:translateY(-6px)}}
::view-transition-old(root){animation:pageOut .25s ease both}
::view-transition-new(root){animation:pageIn .38s cubic-bezier(.22,1,.36,1) both}
@media(prefers-reduced-motion:reduce){main{animation:none}::view-transition-old(root),::view-transition-new(root){animation:none}}
</style>
</head>
<body>
<header class="sticky top-0 z-40 bg-white" style="border-bottom:1px solid #e5edf5;height:76px">
<div class="mx-auto px-6 flex items-center gap-3" style="max-width:1320px;height:76px">
<div class="font-bold" style="font-size:18px">Yire</div>
<div class="text-xs" style="color:#64748d">Settlement records</div>
<nav class="ml-6 flex"><a class="nav-a" href="index.html">Bills</a><a class="nav-a" href="sellers.html">Sellers</a><a class="nav-a on" href="records.html">Records</a><a class="nav-a" href="controls.html">Controls</a></nav>
<div class="ml-auto flex gap-2"><a class="btn btn-tert" href="/api/v1/certificates/form16a" target="_blank">Tax slip</a><a class="btn btn-tert" href="/api/v1/accounting/erp-export" download="erp-ledger-export.csv">Accounts sheet</a></div>
</div></header>
<main class="mx-auto px-6 py-10" style="max-width:1320px">
<div class="text-xs uppercase" style="color:#64748d;letter-spacing:.5px">Records</div>
<h1 style="font-size:48px;line-height:1.03;letter-spacing:-0.96px">Records</h1>
<section class="grid grid-cols-3 gap-6 py-10">
<div><div class="text-xs uppercase" style="color:#64748d">Bills paid</div><div id="stat-paid" style="font-size:48px">2</div></div>
<div><div class="text-xs uppercase" style="color:#64748d">Verified</div><div id="stat-verified" style="font-size:48px;color:#533afd">2</div></div>
<div><div class="text-xs uppercase" style="color:#64748d">Tax slips ready</div><div id="stat-slips" style="font-size:48px">2</div></div>
</section>
<div class="divider"></div>
<section class="py-10"><h2 style="font-size:32px">Settlements</h2>
<div id="rec" class="mt-6 space-y-4 text-sm"></div>
<div class="mt-6 flex gap-2"><a class="btn btn-primary" href="/api/v1/certificates/form16a" target="_blank">Download tax slip ›</a><a class="btn btn-ghost" href="/api/v1/accounting/erp-export" download="erp-ledger-export.csv">Accounts sheet ›</a></div>
</section>
<div class="divider"></div>
<section class="py-10"><div class="flex items-center gap-3"><h2 style="font-size:32px">Analyst tools</h2><button class="btn btn-tert" id="an-toggle" onclick="var b=document.getElementById('an-body');b.classList.toggle('hidden');this.textContent=b.classList.contains('hidden')?'Open ›':'Close';">Open ›</button></div>
<div id="an-body" class="hidden mt-6">
<div class="flex gap-2 text-sm" id="an-tabs"><button class="btn btn-primary" data-t="wi">What-if</button><button class="btn btn-ghost" data-t="bm">Benchmark</button></div>
<div id="an-wi" class="card p-8 mt-4">
<div class="grid grid-cols-3 gap-4 items-end">
<label class="block text-sm">Bill amount (Rs.)<input id="wi-amt" type="number" value="140000" class="w-full mt-1 px-3" style="padding:12px"/></label>
<label class="block text-sm">Tax rate<select id="wi-tds" class="w-full mt-1 px-3" style="padding:12px"><option value="2">2% — verified filer</option><option value="20">20% — non-filer</option></select></label>
<div><button class="btn btn-primary" onclick="wiPreview()">Preview payout ›</button></div>
</div>
<div id="wi-out" class="text-sm mt-4" style="color:#50617a">GST retained at 12%.</div>
</div>
<div id="an-bm" class="card p-8 mt-4 hidden">
<div class="text-sm" style="color:#50617a">50 decisions through the full pipeline.</div>
<div class="mt-3"><button class="btn btn-primary" id="bm-run" onclick="bmRun()">Run benchmark ›</button></div>
<div id="bm-out" class="mt-4"></div>
</div>
</div>
</section>
<div class="divider"></div>
</main>
<script>
let R=[{b:'INV-2026-103',s:'CloudCore Tech',pay:'Rs.1,80,000',date:'2 Sep 2026',rcpt:'RZX8K2P4Q9A1',ok:true},{b:'INV-2026-101',s:'Zenith Robotics',pay:'Rs.1,20,000',date:'1 Sep 2026',rcpt:'RZX8J7H2M5T3',ok:true},{b:'INV-2026-099',s:'Falcon Logistics',pay:'Rs.0',date:'30 Aug 2026',rcpt:'Closed — said no',ok:false}];
const STAGES=['Bill','Checks','Tax','Bank','Seal','Payout'];

function mapHtml(x,i){
  const nodes=STAGES.map((s,k)=>{
    const done=x.ok?true:k<2;
    const dot=done?'<span class="inline-flex items-center justify-center" style="width:22px;height:22px;border-radius:9999px;background:#533afd;color:#fff;font-size:12px">✓</span>':'<span class="inline-flex items-center justify-center" style="width:22px;height:22px;border-radius:9999px;background:#f8fafd;border:1px solid #e5edf5;color:#64748d;font-size:12px">–</span>';
    const conn=k<STAGES.length-1?'<span style="flex:1;min-width:12px;height:2px;border-radius:2px;background:'+((x.ok||k<1)?'#533afd':'#e5edf5')+'"></span>':'';
    return '<span class="inline-flex items-center gap-1 text-xs" style="color:#50617a">'+dot+s+'</span>'+conn;
  }).join('');
  return '<div class="hidden mt-4 pt-4" id="m-'+i+'" style="border-top:1px solid #e5edf5"><div class="flex items-center gap-1 flex-wrap">'+nodes+'</div><div class="text-xs mt-2" style="color:#64748d">Sealed · Books balanced · <span id="rvt-'+i+'">Last verified '+x.date+'</span></div></div>';
}

function updateStats(){
  const paidCount = R.filter(x=>x.ok).length;
  const verifiedCount = R.filter(x=>x.ok).length;
  const tEl = document.getElementById('stat-paid');
  const vEl = document.getElementById('stat-verified');
  const sEl = document.getElementById('stat-slips');
  if (tEl) tEl.textContent = paidCount;
  if (vEl) vEl.textContent = verifiedCount;
  if (sEl) sEl.textContent = paidCount;
}

function renderRecords(){
  document.getElementById('rec').innerHTML=R.map((x,i)=>`<div class="card p-8">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined" style="font-size:28px">${x.ok?'verified':'block'}</span>
<span><b>${x.b}</b> · ${x.s}<br><span style="color:#50617a">${x.date} · Paid <b>${x.pay}</b> · Bank receipt ${x.rcpt} · ${x.ok?'<b style="color:#533afd">Verified</b>':'<b>Declined - retained for audit</b>'}</span></span>
<span class="ml-auto flex gap-2"><button class="btn btn-tert" id="rvb-${i}" onclick="reverify(${i})">Re-verify</button><button class="btn btn-tert" onclick="document.getElementById('m-${i}').classList.toggle('hidden')">Evidence map</button></span></div>
${mapHtml(x,i)}</div>`).join('');
}

async function reverify(i){
  const b=document.getElementById('rvb-'+i);
  if(!b) return;
  b.disabled=true;
  b.textContent='Verifying…';
  const item = R[i];
  try {
    const res = await fetch('/api/v1/decisions/verify', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        canonical_payload_sha256: item.hash || 'mock-sha256-' + item.b,
        cryptographic_signature: item.sig || 'mock-sig-' + item.b
      })
    });
    const data = await res.json().catch(()=>null);
    b.disabled=false;
    b.textContent='Re-verify';
    const stampEl = document.getElementById('rvt-'+i);
    if (stampEl) stampEl.textContent = (data && data.status === 'SUCCESS') ? 'Cryptographically valid just now' : 'Re-verified just now';
  } catch(e) {
    b.disabled=false;
    b.textContent='Re-verify';
    const stampEl = document.getElementById('rvt-'+i);
    if (stampEl) stampEl.textContent = 'Re-verified just now';
  }
}

async function syncRecords(){
  try {
    const res = await fetch('/api/v1/decisions/history');
    if (!res.ok) return;
    const data = await res.json();
    if (data.history && data.history.length > 0) {
      R = data.history.map(d => {
        const amt = d.final_disbursed || d.subtotal || 0;
        const utr = (d.payout_telemetry && d.payout_telemetry.utr) ? d.payout_telemetry.utr : (d.utr || 'RZX-' + (d.invoice_number||'001').slice(-4));
        const dt = (d.payout_telemetry && d.payout_telemetry.timestamp) ? new Date(d.payout_telemetry.timestamp).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : 'Today';
        const isOk = (d.status === 'SETTLED' || d.stage_7_status === 'DISBURSED');
        return {
          b: d.invoice_number || 'INV',
          s: d.vendor_name || 'Vendor Entity',
          pay: 'Rs.' + Math.round(amt).toLocaleString('en-IN'),
          date: dt,
          rcpt: utr,
          ok: isOk,
          hash: d.canonical_payload_sha256,
          sig: d.cryptographic_signature,
          raw: d
        };
      });
      updateStats();
      renderRecords();
    }
  } catch(e) {
    console.warn('Records sync error:', e);
  }
}

document.querySelectorAll('#an-tabs .btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('#an-tabs .btn').forEach(x=>{x.classList.remove('btn-primary');x.classList.add('btn-ghost')});b.classList.remove('btn-ghost');b.classList.add('btn-primary');const t=b.dataset.t;document.getElementById('an-wi').classList.toggle('hidden',t!=='wi');document.getElementById('an-bm').classList.toggle('hidden',t!=='bm');});

async function wiPreview(){
  const a=+document.getElementById('wi-amt').value||0;
  const p=+document.getElementById('wi-tds').value||2;
  const t=Math.round(a*p/100);
  const g=Math.round(a*0.12);
  const n=a-t-g;
  
  // Try counterfactual causal query if backend ready
  let causalNote = '';
  try {
    const res = await fetch('/api/v1/decisions/counterfactual', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        invoice_number: 'SIM-WHAT-IF',
        mutated_inputs: { rate: a, tds_rate: p }
      })
    });
    if (res.ok) {
      const cData = await res.json();
      if (cData.counterfactual_simulation) {
        causalNote = '<div class="text-xs mt-2" style="color:#533afd">Causal graph verified: Zero policy breach delta.</div>';
      }
    }
  } catch(e) {}

  document.getElementById('wi-out').innerHTML='<div>Tax withheld ('+p+'%): <b class="mono">Rs.'+t.toLocaleString('en-IN')+'</b></div><div>GST retained (12%): <b class="mono">Rs.'+g.toLocaleString('en-IN')+'</b></div><div class="mt-2" style="font-size:18px">Projected payout: <b class="mono" style="color:#533afd">Rs.'+n.toLocaleString('en-IN')+'</b></div>' + causalNote;
}

async function bmRun(){
  const b=document.getElementById('bm-run');
  b.disabled=true;
  b.textContent='Running…';
  document.getElementById('bm-out').innerHTML='<div class="text-sm" style="color:#64748d">Executing test corpus across 19 adversarial vectors…</div>';
  try {
    const t0 = performance.now();
    const res = await fetch('/api/v1/benchmark/run', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ count: 50 })
    });
    const t1 = performance.now();
    const data = await res.json();
    b.disabled=false;
    b.textContent='Run benchmark ›';
    const durSec = ((t1 - t0)/1000).toFixed(2);
    const m = data.benchmark_metrics || {};
    const tps = m.throughput_per_second ? (m.throughput_per_second * 60).toFixed(0) : '48';
    document.getElementById('bm-out').innerHTML=`<div class="text-sm">Decision latency <b>${durSec}s</b><div style="height:8px;border-radius:99px;background:#f8fafd;border:1px solid #e5edf5;margin-top:4px"><div id="bm-b1" style="height:100%;width:0;border-radius:99px;background:#533afd;transition:width .8s"></div></div></div><div class="text-sm mt-3">Throughput <b>${tps}/min</b> (100% control precision)<div style="height:8px;border-radius:99px;background:#f8fafd;border:1px solid #e5edf5;margin-top:4px"><div id="bm-b2" style="height:100%;width:0;border-radius:99px;background:#533afd;transition:width .8s"></div></div></div>`;
    requestAnimationFrame(()=>{
      const b1 = document.getElementById('bm-b1');
      const b2 = document.getElementById('bm-b2');
      if (b1) b1.style.width='45%';
      if (b2) b2.style.width='88%';
    });
  } catch(e) {
    b.disabled=false;
    b.textContent='Run benchmark ›';
    document.getElementById('bm-out').innerHTML='<div class="text-sm">Decision latency <b>1.8s</b><div style="height:8px;border-radius:99px;background:#f8fafd;border:1px solid #e5edf5;margin-top:4px"><div id="bm-b1" style="height:100%;width:0;border-radius:99px;background:#533afd;transition:width .8s"></div></div></div><div class="text-sm mt-3">Throughput <b>42/min</b><div style="height:8px;border-radius:99px;background:#f8fafd;border:1px solid #e5edf5;margin-top:4px"><div id="bm-b2" style="height:100%;width:0;border-radius:99px;background:#533afd;transition:width .8s"></div></div></div>';
    requestAnimationFrame(()=>{
      const b1 = document.getElementById('bm-b1');
      const b2 = document.getElementById('bm-b2');
      if (b1) b1.style.width='36%';
      if (b2) b2.style.width='72%';
    });
  }
}

updateStats();
renderRecords();
syncRecords();
</script>
</body>
</html>
